<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено — EcoMind System</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F5F5EE; --ink: #1D1D1B; --lime: #AFCB1F; --lime-tint: #EAF0C4; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      padding: 24px 16px;
      background: var(--bg); color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      text-align: center;
    }
    img { height: 44px; margin: 0 auto 48px; display: block; }
    .code { font-family: Unbounded, sans-serif; font-size: clamp(88px, 22vw, 180px); line-height: 1; color: var(--lime); }
    h1 { margin: 16px 0 12px; font-family: Unbounded, sans-serif; font-size: clamp(22px, 4vw, 32px); }
    p { max-width: 420px; margin: 0 auto 32px; color: rgba(29, 29, 27, .66); line-height: 1.6; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px;
      border-radius: 999px; background: var(--ink); color: var(--bg);
      font-weight: 600; text-decoration: none; transition: background-color .3s, color .3s;
    }
    a.btn:hover { background: var(--lime); color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/logo-ecomind-system.png" alt="EcoMind System">
    <div class="code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, посилання застаріло. Поверніться на головну, щоб дізнатися про підхід EcoMind і записатися на розбір.</p>
    <a class="btn" href="/">На головну</a>
  </main>
</body>
</html>
